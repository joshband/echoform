name: DSP QA - Critical Suite

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  harness-critical:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libcurl4-openssl-dev \
            liblapack-dev \
            liblapacke-dev \
            libopenblas-dev \
            libfftw3-dev

      - name: Configure CMake
        run: |
          cmake -B build_qa \
            -DENABLE_QA_HARNESS=ON \
            -DBUILD_QA_TESTS=ON \
            -DENABLE_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build QA harness
        run: cmake --build build_qa --target echoform_qa -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Run critical suite
        run: |
          cd build_qa
          ./echoform_qa_artefacts/Release/echoform_qa ../scenarios/echoform_critical_suite.json

      - name: Publish QA job summary
        if: always()
        run: |
          SUMMARY_PATH=""
          if [ -f build_qa/qa_output/report/ci_summary.md ]; then
            SUMMARY_PATH="build_qa/qa_output/report/ci_summary.md"
          elif [ -f qa_output/report/ci_summary.md ]; then
            SUMMARY_PATH="qa_output/report/ci_summary.md"
          else
            echo "No report/ci_summary.md found in QA outputs"
            exit 0
          fi

          if [ -x external/qa_harness/scripts/publish_ci_summary.sh ]; then
            external/qa_harness/scripts/publish_ci_summary.sh "$SUMMARY_PATH"
          elif [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$SUMMARY_PATH"
          fi

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-critical-output-${{ matrix.os }}
          path: |
            qa_output/
            build_qa/qa_output/
          retention-days: 7

      - name: Comment on PR (failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **DSP QA Critical Suite Failed**\n\nPlease check the workflow logs and uploaded artifacts for details.\n\nSee [TESTING.md](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/main/TESTING.md) for troubleshooting guide.'
            })
