name: DSP QA - Performance Profiling

on:
  workflow_dispatch:

jobs:
  harness-perf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libcurl4-openssl-dev \
            liblapack-dev \
            liblapacke-dev \
            libopenblas-dev \
            libfftw3-dev

      - name: Configure CMake (optimized build)
        run: |
          cmake -B build_qa \
            -DENABLE_QA_HARNESS=ON \
            -DBUILD_QA_TESTS=ON \
            -DENABLE_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -march=native" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build QA harness
        run: cmake --build build_qa --target echoform_qa -j$(nproc)

      - name: Run performance suite
        run: |
          cd build_qa
          ./echoform_qa_artefacts/Release/echoform_qa ../scenarios/echoform_performance_suite.json
        continue-on-error: true

      - name: Publish QA job summary
        if: always()
        run: |
          SUMMARY_PATH=""
          SUITE_JSON_PATH=""
          if [ -f build_qa/qa_output/report/ci_summary.md ]; then
            SUMMARY_PATH="build_qa/qa_output/report/ci_summary.md"
          elif [ -f qa_output/report/ci_summary.md ]; then
            SUMMARY_PATH="qa_output/report/ci_summary.md"
          elif [ -f build_qa/qa_output/suite_result.json ]; then
            SUITE_JSON_PATH="build_qa/qa_output/suite_result.json"
          elif [ -f qa_output/suite_result.json ]; then
            SUITE_JSON_PATH="qa_output/suite_result.json"
          else
            echo "No QA CI summary or suite_result.json found"
            exit 0
          fi

          if [ -z "$SUMMARY_PATH" ] && [ -n "$SUITE_JSON_PATH" ]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1], "r", encoding="utf-8")); s=d.get("summary", {}); a=d.get("scenarios", []); suite=d.get("suite_id", "qa_suite"); status=d.get("status", "UNKNOWN"); total=s.get("total", len(a)); passed=s.get("passed", 0); warned=s.get("warned", 0); failed=s.get("failed", 0); errors=s.get("errors", 0); skipped=s.get("skipped", 0); print("## QA Suite Job Summary\n"); print("| Suite | Status | Total | Pass | Warn | Fail | Error | Skip |"); print("|---|---:|---:|---:|---:|---:|---:|---:|"); print(f"| `{suite}` | `{status}` | {total} | {passed} | {warned} | {failed} | {errors} | {skipped} |")' "$SUITE_JSON_PATH" > /tmp/qa_ci_summary.md
            SUMMARY_PATH="/tmp/qa_ci_summary.md"
          fi

          if [ -x external/qa_harness/scripts/publish_ci_summary.sh ]; then
            external/qa_harness/scripts/publish_ci_summary.sh "$SUMMARY_PATH"
          elif [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$SUMMARY_PATH"
          fi

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-perf-reports
          path: |
            qa_output/
            build_qa/qa_output/
          retention-days: 90
